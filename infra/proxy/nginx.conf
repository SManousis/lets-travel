events {}
http {
  upstream gateway { server api-gateway:8080; }
  upstream dashboard { server admin-ui:8080; }
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/gateway.crt;
    ssl_certificate_key /etc/nginx/tls/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The UI's own server adds the Content-Security-Policy; API answers get the basics here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 256k;
    server_tokens off;
    location ^~ /api {
      proxy_pass http://gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      # Overwritten, never passed through: the gateway's per-address rate limits rely on it.
      proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
      proxy_pass http://dashboard;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
