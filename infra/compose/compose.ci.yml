name: travel-plan-ci
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    restart: unless-stopped
    environment:
      JENKINS_SLAVE_AGENT_PORT: "50000"
    ports: ["127.0.0.1:8090:8080", "127.0.0.1:50000:50000"]
    volumes: [jenkins-data:/var/jenkins_home]
  sonarqube:
    image: sonarqube:lts-community
    restart: unless-stopped
    environment:
      # Disables Elasticsearch mmap so Docker Desktop's default vm.max_map_count is enough.
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
    ports: ["127.0.0.1:9000:9000"]
    volumes: [sonarqube-data:/opt/sonarqube/data, sonarqube-extensions:/opt/sonarqube/extensions]
volumes:
  jenkins-data:
  sonarqube-data:
  sonarqube-extensions:
