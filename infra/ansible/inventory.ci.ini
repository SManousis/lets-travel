# Local release target started by infra/compose/compose.ci-deploy.yml.
[lets_travel]
deploy-host ansible_user=deploy

[lets_travel:vars]
ansible_python_interpreter=/usr/bin/python3
# The release images are built on this host just before deploying, so it can be slow to
# answer SSH for a while. Wait longer and retry instead of failing the release.
ansible_ssh_timeout=60
ansible_ssh_retries=3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
