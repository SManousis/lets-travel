---
- name: Deploy an immutable Let's Travel release
  hosts: lets_travel
  become: true
  vars:
    app_dir: /opt/lets-travel
    compose_files: [compose.yml, compose.release.yml, compose.secure.yml]
    required_tls_files:
      - dev-ca.crt
      - gateway.crt
      - gateway.key
      - server.crt
      - server.key
      - vault.crt
      - vault.key
      - public.crt
      - private.key
      - trusted/dev-ca.crt
    # Image users: postgres 999:999, vault 100:1000, neo4j 7474:7474.
    service_tls:
      - { dir: postgres, uid: 999, gid: 999, files: [server.crt, server.key] }
      - { dir: vault, uid: 100, gid: 1000, files: [vault.crt, vault.key] }
      - { dir: neo4j, uid: 7474, gid: 7474, files: [public.crt, private.key] }
    release_secrets:
      POSTGRES_SUPERUSER_PASSWORD: "{{ postgres_superuser_password | default(lookup('ansible.builtin.env', 'POSTGRES_SUPERUSER_PASSWORD'), true) }}"
      AUTH_DB_PASSWORD: "{{ auth_db_password | default(lookup('ansible.builtin.env', 'AUTH_DB_PASSWORD'), true) }}"
      USERS_DB_PASSWORD: "{{ users_db_password | default(lookup('ansible.builtin.env', 'USERS_DB_PASSWORD'), true) }}"
      PAYMENTS_DB_PASSWORD: "{{ payments_db_password | default(lookup('ansible.builtin.env', 'PAYMENTS_DB_PASSWORD'), true) }}"
      ENGAGEMENT_DB_PASSWORD: "{{ engagement_db_password | default(lookup('ansible.builtin.env', 'ENGAGEMENT_DB_PASSWORD'), true) }}"
      ELASTICSEARCH_PASSWORD: "{{ elasticsearch_password | default(lookup('ansible.builtin.env', 'ELASTICSEARCH_PASSWORD'), true) }}"
      NEO4J_PASSWORD: "{{ neo4j_password | default(lookup('ansible.builtin.env', 'NEO4J_PASSWORD'), true) }}"
      AUTH_TOKEN_SECRET: "{{ auth_token_secret | default(lookup('ansible.builtin.env', 'AUTH_TOKEN_SECRET'), true) }}"
      ADMIN_USERNAME: "{{ admin_username | default(lookup('ansible.builtin.env', 'ADMIN_USERNAME'), true) }}"
      ADMIN_PASSWORD: "{{ admin_password | default(lookup('ansible.builtin.env', 'ADMIN_PASSWORD'), true) }}"
      AUTH_INTERNAL_SERVICE_TOKEN: "{{ auth_internal_service_token | default(lookup('ansible.builtin.env', 'AUTH_INTERNAL_SERVICE_TOKEN'), true) }}"
    optional_release_secrets:
      STRIPE_SANDBOX_SECRET_KEY: "{{ stripe_sandbox_secret_key | default(lookup('ansible.builtin.env', 'STRIPE_SANDBOX_SECRET_KEY'), true) }}"
      PAYPAL_SANDBOX_CLIENT_ID: "{{ paypal_sandbox_client_id | default(lookup('ansible.builtin.env', 'PAYPAL_SANDBOX_CLIENT_ID'), true) }}"
      PAYPAL_SANDBOX_CLIENT_SECRET: "{{ paypal_sandbox_client_secret | default(lookup('ansible.builtin.env', 'PAYPAL_SANDBOX_CLIENT_SECRET'), true) }}"
      STRIPE_WEBHOOK_SECRET: "{{ stripe_webhook_secret | default(lookup('ansible.builtin.env', 'STRIPE_WEBHOOK_SECRET'), true) }}"
      # Demo and audit environments only: offers the simulated "test card" (no real money). Off unless set.
      PAYMENT_TEST_PROVIDER_ENABLED: >-
        {{ payment_test_provider_enabled
           | default(lookup('ansible.builtin.env', 'PAYMENT_TEST_PROVIDER_ENABLED'), true) | default('false', true) }}
      PAYMENT_TEST_WEBHOOK_SECRET: "{{ payment_test_webhook_secret | default(lookup('ansible.builtin.env', 'PAYMENT_TEST_WEBHOOK_SECRET'), true) }}"
  tasks:
    - name: Validate release identity and registry input
      ansible.builtin.assert:
        that:
          - release_tag is defined
          - release_tag is match('^[0-9a-f]{40}$')
          - image_prefix is defined
          - image_prefix is match('^[a-zA-Z0-9._:/-]+$')
          - registry_host is defined
          - registry_host | length > 0
        fail_msg: A full Git SHA, image prefix, and registry host are required.

    - name: Require non-placeholder application secrets
      ansible.builtin.assert:
        that:
          - item.value | length > 0
          - >-
            item.value not in ['change-me-local-only', 'change-me-auth',
            'change-me-users', 'change-me-payments', 'change-me-neo4j',
            'change-me-engagement', 'change-me-elasticsearch',
            'change-me-admin', 'change-me-internal',
            'replace-with-at-least-32-random-characters']
          - item.value is not search('[\x0a\x0d]')
        fail_msg: "A required release secret is absent or a placeholder: {{ item.key }}"
      loop: "{{ release_secrets | dict2items }}"
      no_log: true

    - name: Validate token signing secret length
      ansible.builtin.assert:
        that: release_secrets.AUTH_TOKEN_SECRET | length >= 32
        fail_msg: AUTH_TOKEN_SECRET must be at least 32 characters.
      no_log: true

    - name: Reject line breaks in optional provider secrets
      ansible.builtin.assert:
        that: item.value is not search('[\x0a\x0d]')
      loop: "{{ optional_release_secrets | dict2items }}"
      no_log: true

    - name: Check registry credentials
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'REGISTRY_USER') | length > 0
          - lookup('ansible.builtin.env', 'REGISTRY_PASSWORD') | length > 0
        fail_msg: REGISTRY_USER and REGISTRY_PASSWORD must be supplied by Jenkins credentials.
      no_log: true

    - name: Check target TLS files
      ansible.builtin.stat:
        path: "{{ app_dir }}/tls/certs/{{ item }}"
      loop: "{{ required_tls_files }}"
      register: tls_files

    - name: Require provisioned TLS files
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Provision {{ item.item }} under {{ app_dir }}/tls/certs before deploying."
      loop: "{{ tls_files.results }}"

    - name: Create service-owned TLS directories
      ansible.builtin.file:
        path: "{{ app_dir }}/tls/certs/{{ item.dir }}"
        state: directory
        owner: "{{ item.uid }}"
        group: "{{ item.gid }}"
        mode: '0700'
      loop: "{{ service_tls }}"
      loop_control:
        label: "{{ item.dir }}"

    - name: Copy service-owned TLS material
      ansible.builtin.copy:
        src: "{{ app_dir }}/tls/certs/{{ item.1 }}"
        dest: "{{ app_dir }}/tls/certs/{{ item.0.dir }}/{{ item.1 }}"
        remote_src: true
        owner: "{{ item.0.uid }}"
        group: "{{ item.0.gid }}"
        mode: '0600'
      loop: "{{ service_tls | subelements('files') }}"
      loop_control:
        label: "{{ item.0.dir }}/{{ item.1 }}"

    - name: Create release directories
      ansible.builtin.file:
        path: "{{ app_dir }}/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - compose
        - postgres/init
        - neo4j/init
        - proxy
        - vault/config

    - name: Copy Compose manifests
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../compose/"
        dest: "{{ app_dir }}/compose/"
        mode: preserve

    - name: Copy PostgreSQL initialization scripts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../postgres/init/"
        dest: "{{ app_dir }}/postgres/init/"
        mode: preserve

    - name: Copy Neo4j initialization scripts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../neo4j/init/"
        dest: "{{ app_dir }}/neo4j/init/"
        mode: preserve

    - name: Copy TLS proxy configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../proxy/nginx.conf"
        dest: "{{ app_dir }}/proxy/nginx.conf"
        mode: '0644'

    - name: Copy Vault configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../vault/config/"
        dest: "{{ app_dir }}/vault/config/"
        mode: preserve

    - name: Read the release that is running now
      ansible.builtin.slurp:
        src: "{{ app_dir }}/current-release"
      register: running_release
      failed_when: false

    # Before this playbook recorded releases, the running tag was only in the rendered environment file.
    - name: Read the environment of the running release
      ansible.builtin.slurp:
        src: "{{ app_dir }}/.env"
      register: running_environment
      failed_when: false
      no_log: true

    - name: Remember the running release for rollback
      ansible.builtin.set_fact:
        previous_release_tag: >-
          {{ (running_release.content | b64decode | trim) if running_release.content is defined
             else ((running_environment.content | b64decode | regex_search('(?m)^RELEASE_TAG=(\S+)$', '\1') | first)
                   if running_environment.content is defined
                      and (running_environment.content | b64decode) is search('(?m)^RELEASE_TAG=\S+$')
                   else '') }}
        deploy_tag: "{{ release_tag }}"

    - name: Render private release environment
      ansible.builtin.template:
        src: release.env.j2
        dest: "{{ app_dir }}/.env"
        mode: '0600'
      no_log: true

    - name: Authenticate target Docker client to the release registry
      community.docker.docker_login:
        registry_url: "{{ registry_host }}"
        username: "{{ lookup('ansible.builtin.env', 'REGISTRY_USER') }}"
        password: "{{ lookup('ansible.builtin.env', 'REGISTRY_PASSWORD') }}"
      no_log: true

    - name: Start PostgreSQL before the application services
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/compose"
        files: "{{ compose_files }}"
        env_files:
          - "{{ app_dir }}/.env"
        services:
          - postgres
        state: present
        pull: always
        build: never
        wait: true
        wait_timeout: 120

    # PostgreSQL runs its init scripts only on an empty volume. Re-running the idempotent
    # script creates databases and roles added since the volume was first initialized.
    - name: Create missing service databases and roles
      ansible.builtin.command:
        cmd: >-
          docker compose --env-file {{ app_dir }}/.env
          -f compose.yml -f compose.release.yml -f compose.secure.yml
          exec -T postgres bash /docker-entrypoint-initdb.d/001-databases.sh
        chdir: "{{ app_dir }}/compose"
      register: database_bootstrap
      changed_when: "'CREATE DATABASE' in database_bootstrap.stdout or 'CREATE ROLE' in database_bootstrap.stdout"

    # Data volumes are never touched by a rollout or a rollback. Database migrations only add (expand/contract,
    # docs/ci.md), so the previous release still runs on a schema the new release has migrated.
    - name: Roll out the release, or put the previous one back
      block:
        - name: Roll out {{ release_tag }}
          ansible.builtin.include_tasks: rollout.yml

        - name: Record the running release
          ansible.builtin.copy:
            content: "{{ release_tag }}\n"
            dest: "{{ app_dir }}/current-release"
            mode: '0644'

        - name: Append to the release history
          ansible.builtin.lineinfile:
            path: "{{ app_dir }}/release-history"
            line: "{{ now(utc=true).isoformat() }} {{ release_tag }} deployed"
            create: true
            mode: '0644'
      rescue:
        - name: Choose the previous release for rollback
          ansible.builtin.set_fact:
            deploy_tag: "{{ previous_release_tag }}"
          when: previous_release_tag | length > 0 and previous_release_tag != release_tag

        - name: Roll back to {{ previous_release_tag }}
          ansible.builtin.include_tasks: rollout.yml
          when: deploy_tag != release_tag

        - name: Append the rollback to the release history
          ansible.builtin.lineinfile:
            path: "{{ app_dir }}/release-history"
            line: "{{ now(utc=true).isoformat() }} {{ release_tag }} failed; {{ deploy_tag }} restored"
            create: true
            mode: '0644'
          when: deploy_tag != release_tag

        - name: Fail the deployment
          ansible.builtin.fail:
            msg: >-
              Release {{ release_tag }} failed its rollout or health checks.
              {{ ('Rolled back to ' ~ deploy_tag ~ '.') if deploy_tag != release_tag else 'There was no previous release to restore.' }}
