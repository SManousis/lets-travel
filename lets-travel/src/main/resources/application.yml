spring:
  application:
    name: travel-service
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8083}
neo4j:
  uri: ${NEO4J_URI:bolt://neo4j:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:change-me-neo4j}
auth:
  service-url: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
services:
  users:
    url: ${USER_SERVICE_URL:http://127.0.0.1:8082}
  # search-service is told about every travel change; empty disables the notifications.
  search:
    url: ${SEARCH_SERVICE_URL:}
  # Recommendation history is reconciled from engagement-service; empty disables the schedule.
  engagement:
    url: ${ENGAGEMENT_SERVICE_URL:}
recommendations:
  reconcile-initial-delay: ${RECOMMENDATIONS_RECONCILE_INITIAL_DELAY:PT1M}
  reconcile-interval: ${RECOMMENDATIONS_RECONCILE_INTERVAL:PT10M}
security:
  token-secret: ${AUTH_TOKEN_SECRET:replace-with-at-least-32-random-characters}
  internal-service-token: ${AUTH_INTERNAL_SERVICE_TOKEN:change-me-internal}
management:
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9083}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  pattern:
    # Every line written while a request runs carries its X-Request-ID (see RequestIds).
    level: "%5p [%X{requestId:-}]"
