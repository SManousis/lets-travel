sonar.projectKey=lets-travel
sonar.projectName=Let's Travel
sonar.sources=service-common/src/main,auth-service/src/main,user-service/src/main,lets-travel/src/main,payment-service/src/main,api-gateway/src/main,engagement-service/src/main,search-service/src/main,admin-ui/src
sonar.tests=service-common/src/test,auth-service/src/test,user-service/src/test,lets-travel/src/test,payment-service/src/test,api-gateway/src/test,engagement-service/src/test,search-service/src/test,admin-ui/src
# admin-ui keeps tests next to the code, so split its files between sources and tests.
sonar.exclusions=admin-ui/src/**/*.test.ts,admin-ui/src/**/*.test.tsx,admin-ui/src/test/**
sonar.test.inclusions=**/src/test/**,admin-ui/src/**/*.test.ts,admin-ui/src/**/*.test.tsx
sonar.java.binaries=service-common/target/classes,auth-service/target/classes,user-service/target/classes,lets-travel/target/classes,payment-service/target/classes,api-gateway/target/classes,engagement-service/target/classes,search-service/target/classes
# Spring Boot launchers only call SpringApplication.run; every StartupTest boots the service instead.
sonar.coverage.exclusions=**/src/main/java/**/*Application.java
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=admin-ui/coverage/lcov.info
# SonarQube 9.9 bundles a TypeScript version without "Bundler" module resolution.
sonar.typescript.tsconfigPaths=admin-ui/tsconfig.sonar.json
