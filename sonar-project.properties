sonar.projectKey=travel-plan
sonar.projectName=Travel Plan
sonar.sources=auth-service/src/main,user-service/src/main,travel-service/src/main,payment-service/src/main,api-gateway/src/main,admin-ui/src
sonar.tests=auth-service/src/test,user-service/src/test,travel-service/src/test,payment-service/src/test,api-gateway/src/test,admin-ui/src
# admin-ui keeps tests next to the code, so split its files between sources and tests.
sonar.exclusions=admin-ui/src/**/*.test.ts,admin-ui/src/**/*.test.tsx,admin-ui/src/test/**
sonar.test.inclusions=**/src/test/**,admin-ui/src/**/*.test.ts,admin-ui/src/**/*.test.tsx
sonar.java.binaries=auth-service/target/classes,user-service/target/classes,travel-service/target/classes,payment-service/target/classes,api-gateway/target/classes
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
# SonarQube 9.9 bundles a TypeScript version without "Bundler" module resolution.
sonar.typescript.tsconfigPaths=admin-ui/tsconfig.sonar.json
