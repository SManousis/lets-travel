---
openapi: 3.0.3
info:
  title: Travel search API
  version: 1.0.0
  description: 'search-service (Phase 5). Elasticsearch holds a derived copy of the published,
    bookable travels; travel-service remains the source of truth (see docs/search.md).
    Clients never send Elasticsearch query syntax: free text is matched as plain text
    and every filter is a typed, bounded parameter. When Elasticsearch is unavailable
    the service answers 503 SEARCH_UNAVAILABLE and clients fall back to the published
    travel list (GET /api/travels in travels.yaml), telling the user search is
    temporarily limited.'
servers:
- url: http://localhost:8080
  description: Loopback development gateway; deployment requires HTTPS.
security:
- bearerAuth: []
x-required-role: TRAVELER
paths:
  "/api/search/travels":
    get:
      operationId: searchTravels
      summary: Search published, bookable travels
      description: Full-text search over title, description, destinations, countries,
        activities, accommodation, transport and manager name, combined with optional
        filters. Matching ignores case and accents. Exact phrases rank first, then
        word prefixes, then matches with a typo. An empty `q` returns every bookable
        travel ordered by start date. Only published travels that start in the future
        and still have places are returned.
      parameters:
      - name: q
        in: query
        description: Plain search text, trimmed. Control characters are rejected.
        schema:
          type: string
          maxLength: 100
      - name: country
        in: query
        description: Country of any destination, as stored on the destination (case
          and accents ignored).
        schema:
          type: string
          minLength: 2
          maxLength: 60
      - name: transportMode
        in: query
        description: Transport mode of any leg, e.g. TRAIN (case ignored).
        schema:
          type: string
          minLength: 2
          maxLength: 60
      - name: startFrom
        in: query
        description: Earliest start date (inclusive).
        schema:
          type: string
          format: date
      - name: startTo
        in: query
        description: Latest start date (inclusive); not before `startFrom`.
        schema:
          type: string
          format: date
      - name: minPrice
        in: query
        description: Minimum price in `currency`.
        schema:
          type: number
          minimum: 0
      - name: maxPrice
        in: query
        description: Maximum price in `currency`; not below `minPrice`.
        schema:
          type: number
          minimum: 0
      - name: currency
        in: query
        description: Only travels priced in this currency. Required when a price filter
          is given, because prices in different currencies are not comparable.
        schema:
          "$ref": "#/components/schemas/Currency"
      - name: sort
        in: query
        description: '`RELEVANCE` (default when `q` is set), `START_DATE` (default
          otherwise), `PRICE_ASC` or `PRICE_DESC`. Ties break on start date, then
          travel ID, so the order is always the same.'
        schema:
          type: string
          enum:
          - RELEVANCE
          - START_DATE
          - PRICE_ASC
          - PRICE_DESC
      - name: page
        in: query
        description: Zero-based page. `(page + 1) * size` may not exceed 1000.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Matching travels.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TravelHitPage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/api/search/autocomplete":
    get:
      operationId: autocompleteTravels
      summary: Suggest completions while typing
      description: Suggestions from travel titles, destinations, countries and activities
        of bookable travels. Clients debounce input (about 250 ms) and send at least
        two characters. Exact matches come first, then prefix matches, then matches
        with a typo.
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 64
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 8
      responses:
        '200':
          description: Suggestions, best first.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Suggestions"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/api/search/admin/status":
    get:
      operationId: searchIndexStatus
      summary: Index health, lag and failing changes
      description: Operational view for Admins. `pendingChanges` is the sync lag (travel
        changes received but not yet applied); `failingChanges` lists changes whose
        last attempt failed and that are being retried.
      x-required-role: ADMIN
      responses:
        '200':
          description: Current index state.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IndexStatus"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/search/admin/reindex":
    post:
      operationId: rebuildSearchIndex
      summary: Rebuild the index from travel-service now
      description: Copies every bookable travel into a new versioned index and switches
        the `travels` alias to it in one step; searches keep using the old index until
        then. The same rebuild also runs automatically every few minutes.
      x-required-role: ADMIN
      responses:
        '200':
          description: The rebuild finished.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Rebuild"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token checked at the gateway and in the receiving service.
        Roles inherit, see docs/api/README.md.
  responses:
    BadRequest:
      description: Invalid query, filter or pagination value (`INVALID_QUERY`), with
        one entry per problem in `fieldErrors`.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, expired or revoked authentication.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: The caller's role is not allowed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unavailable:
      description: Elasticsearch is unavailable (`SEARCH_UNAVAILABLE`), or for a rebuild
        travel-service is (`DEPENDENCY_UNAVAILABLE`). Use the published travel list
        instead.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Suggested delay in seconds.
  schemas:
    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      description: ISO 4217 code.
      example: EUR
    TravelHit:
      type: object
      additionalProperties: false
      properties:
        travelId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        destinations:
          type: array
          description: Destination names in itinerary order.
          items:
            type: string
        countries:
          type: array
          items:
            type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        durationDays:
          type: integer
        price:
          type: number
          minimum: 0
        currency:
          "$ref": "#/components/schemas/Currency"
        remainingPlaces:
          type: integer
          minimum: 0
        managerId:
          type: string
          format: uuid
        managerName:
          type: string
          nullable: true
          description: Null when user-service could not provide it at indexing time.
        activities:
          type: array
          items:
            type: string
        transportModes:
          type: array
          items:
            type: string
        highlights:
          type: array
          description: Plain-text fragments around matches in the details; clients render
            them as text, never as HTML.
          items:
            type: string
      required:
      - travelId
      - title
      - description
      - destinations
      - countries
      - startDate
      - endDate
      - durationDays
      - price
      - currency
      - remainingPlaces
      - managerId
      - managerName
      - activities
      - transportModes
      - highlights
    TravelHitPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/TravelHit"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        indexedAt:
          type: string
          format: date-time
          nullable: true
          description: Time of the newest change applied to the index, so clients can
            show freshness.
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      - indexedAt
    Suggestion:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
        type:
          type: string
          enum:
          - TRAVEL
          - DESTINATION
          - COUNTRY
          - ACTIVITY
        travelId:
          type: string
          format: uuid
          nullable: true
          description: Set for TRAVEL suggestions, which open the travel directly.
        context:
          type: string
          description: Short disambiguation, e.g. dates and first destination.
      required:
      - text
      - type
      - travelId
      - context
    Suggestions:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Suggestion"
      required:
      - items
    Rebuild:
      type: object
      additionalProperties: false
      properties:
        index:
          type: string
          example: travels-v1-1791380000000
        documents:
          type: integer
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum:
          - SUCCEEDED
          - FAILED
        error:
          type: string
          nullable: true
      required:
      - index
      - documents
      - startedAt
      - finishedAt
      - outcome
      - error
    IndexStatus:
      type: object
      additionalProperties: false
      properties:
        alias:
          type: string
          example: travels
        currentIndex:
          type: string
          nullable: true
        mappingVersion:
          type: string
          example: v1
        elasticsearchAvailable:
          type: boolean
        documents:
          type: integer
          format: int64
        pendingChanges:
          type: integer
        failingChanges:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              travelId:
                type: string
                format: uuid
              attempts:
                type: integer
              lastError:
                type: string
              lastAttemptAt:
                type: string
                format: date-time
            required:
            - travelId
            - attempts
            - lastError
            - lastAttemptAt
        lastAppliedAt:
          type: string
          format: date-time
          nullable: true
        lastRebuild:
          type: object
          nullable: true
          description: Null until the first rebuild has run.
          allOf:
          - "$ref": "#/components/schemas/Rebuild"
      required:
      - alias
      - currentIndex
      - mappingVersion
      - elasticsearchAvailable
      - documents
      - pendingChanges
      - failingChanges
      - lastAppliedAt
      - lastRebuild
    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required:
      - field
      - code
      - message
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          example: SEARCH_UNAVAILABLE
        message:
          type: string
        fieldErrors:
          type: array
          items:
            "$ref": "#/components/schemas/FieldError"
        traceId:
          type: string
      required:
      - code
      - message
      - fieldErrors
      - traceId
