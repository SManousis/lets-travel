openapi: 3.0.3
info:
  title: Travels and destinations API
  version: 0.2.0
  description: Manager-owned travel listings (Phase 2). Every travel has an immutable managerId. TRAVEL_MANAGER
    users manage their own listings, ADMIN manages every listing, TRAVELER users see only bookable published
    listings. Ownership is enforced inside travel-service; the gateway only requires a signed-in user.
    A non-admin asking for another manager's private or nonexistent listing receives 404. Errors are {code,
    message}; conflict codes are listed on the Conflict response.
servers:
- url: http://localhost:8080
  description: Loopback development gateway; deployment requires HTTPS.
security:
- bearerAuth: []
paths:
  /api/destinations:
    get:
      operationId: listDestinations
      summary: List destination records
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      security:
      - adminBearer: []
      x-required-role: ADMIN
    post:
      operationId: createDestination
      summary: Create destination
      responses:
        '201':
          description: Resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
          headers:
            Location:
              description: Gateway-relative resource or operation URL.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationWrite'
      security:
      - adminBearer: []
      x-required-role: ADMIN
  /api/destinations/{destinationId}:
    get:
      operationId: getDestination
      summary: Read destination
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: destinationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - adminBearer: []
      x-required-role: ADMIN
    patch:
      operationId: updateDestination
      summary: Update destination
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationWrite'
      parameters:
      - name: destinationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - adminBearer: []
      x-required-role: ADMIN
    delete:
      operationId: deleteDestination
      summary: Delete destination
      responses:
        '204':
          description: Resource deleted or session revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: destinationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: 409 DESTINATION_IN_USE while any stop references the destination; otherwise 204.
      security:
      - adminBearer: []
      x-required-role: ADMIN
  /api/travels:
    get:
      operationId: listTravels
      summary: List travels visible to the caller
      x-required-role: TRAVELER
      description: ADMIN sees every owned listing. TRAVEL_MANAGER sees only own listings in any status.
        TRAVELER sees only bookable listings (PUBLISHED, future start date, remaining capacity). Ownerless
        legacy travels (LegacyTravelNeedsReview) are never returned.
      responses:
        '200':
          description: One page of listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
    post:
      operationId: createTravel
      summary: Create a draft travel
      x-required-role: TRAVEL_MANAGER
      description: A TRAVEL_MANAGER owns the draft implicitly and any managerId in the body is ignored.
        An ADMIN must send managerId of an active manager (409 MANAGER_REQUIRED or MANAGER_NOT_ACTIVE).
        The owner cannot be changed afterwards.
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Travel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelWrite'
  /api/travels/{travelId}:
    get:
      operationId: getTravel
      summary: Read a travel
      x-required-role: TRAVELER
      responses:
        '200':
          description: The listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Travel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters: &id001
      - $ref: '#/components/parameters/TravelId'
    put:
      operationId: updateTravel
      summary: Replace editable listing and itinerary fields
      x-required-role: TRAVEL_MANAGER
      description: Preserves owner, status, version lineage and participants; increments version. managerId
        in the body is ignored. 409 CAPACITY_BELOW_PARTICIPANTS if capacity drops below the participant
        count.
      responses:
        '200':
          description: Updated listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Travel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelWrite'
    delete:
      operationId: deleteTravel
      summary: Delete a travel
      x-required-role: TRAVEL_MANAGER
      description: 409 TRAVEL_IN_USE while participation state forbids deletion.
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters: *id001
  /api/travels/{travelId}/publication:
    post:
      operationId: publishTravel
      summary: Publish a ready travel
      x-required-role: TRAVEL_MANAGER
      description: 'Idempotent: publishing a PUBLISHED listing returns it without a new event. Requires
        a future start date, nonblank description, positive capacity, a destination stop and valid itinerary
        bounds (409 PUBLICATION_NOT_READY otherwise; 409 TRAVEL_NOT_EDITABLE when CANCELLED).'
      responses:
        '200':
          description: Current representation, PUBLISHED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Travel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters: *id001
    delete:
      operationId: unpublishTravel
      summary: Return a travel to UNPUBLISHED
      x-required-role: TRAVEL_MANAGER
      description: 'Idempotent: repeating the request returns the current representation without a new
        event.'
      responses:
        '200':
          description: Current representation, UNPUBLISHED (or unchanged DRAFT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Travel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters: *id001
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Requires ADMIN at both gateway and service.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token checked at the gateway and in travel-service. Roles inherit ADMIN > TRAVEL_MANAGER
        > TRAVELER.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TravelId:
      name: travelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request or fields. Code INVALID_REQUEST.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, expired or revoked authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer challenge for access-token endpoints.
    Forbidden:
      description: Valid identity lacks the required role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found, or a private listing owned by another manager (indistinguishable
        for non-admins). Code NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Stable safe conflict code. Ownership: MANAGER_REQUIRED, MANAGER_NOT_ACTIVE. Fields:
        INVALID_NAME, INVALID_DATES, INVALID_CAPACITY, INVALID_PRICE, INVALID_CURRENCY. Itinerary: DESTINATION_REQUIRED,
        ITINERARY_REQUIRED, INVALID_STOP_ORDER, STOP_OUTSIDE_TRAVEL, ACTIVITY_OUTSIDE_TRAVEL, ACCOMMODATION_OUTSIDE_TRAVEL,
        TRANSPORT_OUTSIDE_TRAVEL. Lifecycle: PUBLICATION_NOT_READY, TRAVEL_NOT_EDITABLE, TRAVEL_IN_USE,
        CAPACITY_BELOW_PARTICIPANTS, INVALID_PARTICIPANTS, TRAVELER_REMOVED, INCOMPLETE_LEGACY_TRAVEL.
        Destinations: DESTINATION_EXISTS, DESTINATION_IN_USE.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 'Safe 503: DEPENDENCY_UNAVAILABLE (user-service) or TRAVEL_STORE_UNAVAILABLE (Neo4j).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Suggested delay in seconds, if known.
  schemas:
    Accommodation:
      type: object
      additionalProperties: false
      properties:
        id: &id005
          type: string
          format: uuid
        name: &id003
          type: string
          minLength: 1
        address: &id004
          type: string
          minLength: 1
        checkIn: &id002
          type: string
          format: date
        checkOut: *id002
      required:
      - id
      - name
      - address
      - checkIn
      - checkOut
    AccommodationWrite:
      type: object
      additionalProperties: false
      properties:
        name: *id003
        address: *id004
        checkIn: *id002
        checkOut: *id002
      required:
      - name
      - address
      - checkIn
      - checkOut
    Activity:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        name: &id006
          type: string
          minLength: 1
        description: &id007
          type: string
          nullable: true
        date: *id002
      required:
      - id
      - name
      - date
    ActivityWrite:
      type: object
      additionalProperties: false
      properties:
        name: *id006
        description: *id007
        date: *id002
      required:
      - name
      - date
    Destination:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        name:
          type: string
        country:
          type: string
        createdAt: &id014
          type: string
          format: date-time
      required:
      - id
      - name
      - country
      - createdAt
    DestinationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Destination'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - total
    DestinationWrite:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
      required:
      - name
      - country
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: Resource not found
      required:
      - code
      - message
    Stop:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        destinationId: *id005
        position: &id008
          type: integer
          minimum: 0
          description: Unique and contiguous from 0.
        arrivalDate: &id009
          type: string
          format: date
          nullable: true
        departureDate: &id010
          type: string
          format: date
          nullable: true
      required:
      - id
      - destinationId
      - position
    StopWrite:
      type: object
      additionalProperties: false
      properties:
        destinationId: *id005
        position: *id008
        arrivalDate: *id009
        departureDate: *id010
      required:
      - destinationId
      - position
    Transport:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        mode: &id011
          type: string
          minLength: 1
        departure: &id012
          type: string
          minLength: 1
        arrival: &id013
          type: string
          minLength: 1
        date: *id002
      required:
      - id
      - mode
      - departure
      - arrival
      - date
    TransportWrite:
      type: object
      additionalProperties: false
      properties:
        mode: *id011
        departure: *id012
        arrival: *id013
        date: *id002
      required:
      - mode
      - departure
      - arrival
      - date
    Travel:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        managerId:
          type: string
          format: uuid
          description: Immutable owner.
        name:
          type: string
        description:
          type: string
        startDate: *id002
        endDate: *id002
        durationDays:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Inclusive calendar days.
        capacity:
          type: integer
          minimum: 1
        price:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        status:
          $ref: '#/components/schemas/TravelStatus'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Increments on every mutation.
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        accommodations:
          type: array
          items:
            $ref: '#/components/schemas/Accommodation'
        transports:
          type: array
          items:
            $ref: '#/components/schemas/Transport'
        participantCount:
          type: integer
          minimum: 0
        remainingCapacity:
          type: integer
          minimum: 0
        bookable:
          type: boolean
          description: PUBLISHED, start date after today and remaining capacity above zero.
        createdAt: *id014
        updatedAt: *id014
      required:
      - id
      - managerId
      - name
      - description
      - startDate
      - endDate
      - durationDays
      - capacity
      - price
      - currency
      - status
      - version
      - stops
      - activities
      - accommodations
      - transports
      - participantCount
      - remainingCapacity
      - bookable
      - createdAt
      - updatedAt
    TravelPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Travel'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - size
      - total
    TravelStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - UNPUBLISHED
      - CANCELLED
    TravelWrite:
      type: object
      additionalProperties: false
      properties:
        managerId:
          type: string
          format: uuid
          nullable: true
          description: ADMIN only and required for ADMIN; ignored for TRAVEL_MANAGER and never accepted
            on update.
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
          maxLength: 4000
        startDate: *id002
        endDate:
          type: string
          format: date
          description: Inclusive; not before startDate.
        capacity:
          type: integer
          minimum: 1
        price:
          type: number
          minimum: 0
          description: Nonnegative decimal, stored as a decimal string; no floating-point rounding.
        currency:
          type: string
          pattern: ^[A-Za-z]{3}$
          description: Normalised to uppercase.
        stops:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StopWrite'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/ActivityWrite'
          description: May be empty but must be present.
        accommodations:
          type: array
          items:
            $ref: '#/components/schemas/AccommodationWrite'
          description: May be empty but must be present.
        transports:
          type: array
          items:
            $ref: '#/components/schemas/TransportWrite'
          description: May be empty but must be present.
      required:
      - name
      - description
      - startDate
      - endDate
      - capacity
      - price
      - currency
      - stops
      - activities
      - accommodations
      - transports
      description: All stop, activity, accommodation and transport dates must fall inside startDate..endDate.
        Component ids are server-generated.
