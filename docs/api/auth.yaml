---
openapi: 3.0.3
info:
  title: Authentication API
  version: 0.2.0
  description: 'Implemented by auth-service (Phase 1). Every role signs in here. Access
    tokens are HS256 JWTs (claims iss=lets-travel-auth, aud=lets-travel-api, sub=user
    ID, role, sid=session ID, iat, exp, jti) valid for 15 minutes. A session lasts up
    to 12 hours through refresh; logout, disabling, deletion or a role change ends it
    at once. The refresh token lives only in a Secure HttpOnly cookie and is stored
    server-side as a SHA-256 hash.'
servers:
- url: http://localhost:8080
  description: Loopback development gateway; deployment requires HTTPS.
security:
- bearerAuth: []
x-required-role: TRAVELER
paths:
  "/api/auth/login":
    post:
      operationId: login
      summary: Sign in with username (email) and password
      description: Any enabled identity may sign in. Unknown users, wrong passwords
        and disabled identities all return the same 401. Repeated failures for a
        username are throttled with 429.
      security: []
      x-required-role: NONE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: '`refresh_token` (Secure; HttpOnly; SameSite=Strict; Path=/api/auth)
                and `csrf_token` (Secure; SameSite=Strict; Path=/; readable by the
                dashboard). The refresh token never appears in JSON.'
              schema:
                type: string
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokenResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '429':
          description: Too many failed attempts for this username; try again later.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/api/auth/refresh":
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and obtain a new access token
      description: Needs the `refresh_token` cookie, the matching `X-CSRF-Token`
        header (value of the `csrf_token` cookie) and an allowed `Origin`. Both tokens
        rotate on every refresh. Presenting an already rotated refresh token is
        treated as theft and ends the whole session. The new access token carries the
        identity's current role.
      security:
      - refreshCookie: []
      x-required-role: NONE
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 512
      - name: Origin
        in: header
        required: true
        description: Must be one of the configured `ALLOWED_ORIGINS`.
        schema:
          type: string
      responses:
        '200':
          description: Session refreshed.
          headers:
            Set-Cookie:
              description: Rotated `refresh_token` and `csrf_token` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokenResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/api/auth/logout":
    post:
      operationId: logout
      summary: End the current session
      description: Ends the session of the presented access token, so it and its
        refresh token stop working immediately, and expires both cookies.
      responses:
        '204':
          description: Session ended.
          headers:
            Set-Cookie:
              description: Expired `refresh_token` and `csrf_token` cookies.
              schema:
                type: string
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/api/auth/me":
    get:
      operationId: getCurrentIdentity
      summary: Read the identity behind the access token
      description: Returns the verified token's user ID, role and session. The full
        profile is served by `/api/me` (Phase 1b).
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Identity"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '503':
          "$ref": "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token checked at the gateway and in the receiving service
        (signature, issuer, audience, expiry, role, and that the session is active).
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Rotating Secure HttpOnly SameSite=Strict cookie scoped to /api/auth.
  responses:
    BadRequest:
      description: Missing or invalid fields.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthorized:
      description: Invalid credentials, or a missing, invalid, expired or ended session.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer challenge for access-token endpoints.
    Forbidden:
      description: Refresh from an Origin that is missing or not allowed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unavailable:
      description: The session store is unavailable.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required:
      - field
      - code
      - message
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          example: UNAUTHENTICATED
        message:
          type: string
        fieldErrors:
          type: array
          items:
            "$ref": "#/components/schemas/FieldError"
        traceId:
          type: string
      required:
      - code
      - message
      - fieldErrors
      - traceId
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          description: The account email, or the bootstrap admin's configured username.
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
      required:
      - username
      - password
    TokenResponse:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry in seconds since the Unix epoch.
      required:
      - accessToken
      - tokenType
      - expiresAt
    Identity:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - TRAVELER
          - TRAVEL_MANAGER
          - ADMIN
        sessionId:
          type: string
          format: uuid
        expiresAt:
          type: integer
          format: int64
      required:
      - userId
      - role
      - sessionId
      - expiresAt
