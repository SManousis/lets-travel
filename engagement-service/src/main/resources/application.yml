spring:
  application:
    name: engagement-service
  autoconfigure:
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8085}
auth:
  service-url: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
security:
  token-secret: ${AUTH_TOKEN_SECRET:replace-with-at-least-32-random-characters}
  internal-service-token: ${AUTH_INTERNAL_SERVICE_TOKEN:change-me-internal}
services:
  users:
    url: ${USER_SERVICE_URL:http://127.0.0.1:8082}
  travel:
    url: ${TRAVEL_SERVICE_URL:http://127.0.0.1:8083}
  payments:
    url: ${PAYMENT_SERVICE_URL:http://127.0.0.1:8084}
# Outbox events are delivered to travel-service (recommendation history); empty disables the relay.
events:
  relay:
    target-url: ${EVENTS_RELAY_TARGET_URL:}
    interval: ${EVENTS_RELAY_INTERVAL:PT1S}
    initial-delay: ${EVENTS_RELAY_INITIAL_DELAY:PT10S}
management:
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9085}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
---
spring:
  config:
    activate:
      on-profile: infra
  autoconfigure:
    exclude: []
  datasource:
    url: ${ENGAGEMENT_DB_URL:jdbc:postgresql://postgres:5432/travel_engagement}
    username: ${ENGAGEMENT_DB_USER:engagement_app}
    password: ${ENGAGEMENT_DB_PASSWORD:change-me-engagement}
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 30000
  flyway:
    # {vendor}: PostgreSQL-only migrations (the audit triggers) are skipped on the H2 test database.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
logging:
  pattern:
    # Every line written while a request runs carries its X-Request-ID (see RequestIds).
    level: "%5p [%X{requestId:-}]"
